<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts for rendering OG cards (see config/initializers/og_fonts.rb): the
     brand fonts in vendor/fonts, plus the system fonts as a fallback. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/local/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../vendor/fonts</dir>
  <cachedir prefix="relative">../tmp/cache/fontconfig</cachedir>
</fontconfig>
