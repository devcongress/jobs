# Skills offered on profiles and project stacks, by category.
#
# Built from public data, then reviewed by hand to keep only things people list as skills:
# - Stack Overflow: every tag with 1,000+ questions (5,418 tags, October 2026), plus
#   Wikidata's technologies linked to a Stack Overflow tag for proper names.
# - O*NET 30.0 (US Department of Labor): technologies and task statements for 37 tech
#   occupations, covering design, data, security, IT, QA, product and technical writing.
# - Stack Overflow Developer Survey 2025: tools 3%+ of respondents use that the tag data missed.
# Hand-picked additions, which the data under-represents: African payments and fintech
# (Paystack, Flutterwave, mobile money, ...) and recent AI tooling (LLM APIs, vector
# databases, agent frameworks, ...).
#
# Version-specific entries, file formats, devices, consumer apps and generic programming
# concepts are left out. Add new skills here; db:seed only ever adds.

